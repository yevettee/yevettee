<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <meta property="og:image" content="{{ '/assets/etc/og-preview.png' | absolute_url }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{ '/assets/etc/og-preview.png' | absolute_url }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

    <style>
        body { font-family: 'Poppins', 'Pretendard Variable', Pretendard, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        /* portfolYOU-style accent: solid charcoal instead of indigo/purple gradient */
        .bg-gradient-modern { background: #1e293b; }
        .bg-gradient-modern:hover { background: #0f172a; }
        .dark .bg-gradient-modern { background: #e2e8f0; color: #0f172a; }
        .dark .bg-gradient-modern:hover { background: #ffffff; }
        .hover-lift { transition: all 0.3s ease; }
        .hover-lift:hover { transform: translateY(-10px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }

        /* Glassmorphism yang adaptif */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* State untuk Mobile Menu */
        #mobile-menu.active {
            display: flex;
        }

        .project-copy h2 {
            margin-top: 2.75rem;
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
        }
        .dark .project-copy h2 { color: #f8fafc; }
        .project-copy h2:first-child { margin-top: 0; }
        .project-copy p {
            margin-top: 0.75rem;
            line-height: 1.85;
        }
        .project-copy ul {
            margin-top: 0.75rem;
            display: grid;
            gap: 0.6rem;
        }
        .project-copy li {
            position: relative;
            padding-left: 1rem;
            line-height: 1.75;
        }
        .project-copy li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.72em;
            width: 0.35rem;
            height: 0.35rem;
            border-radius: 999px;
            background: #64748b;
        }
        .project-copy ol {
            margin-top: 0.75rem;
            display: grid;
            gap: 0.6rem;
            counter-reset: impl;
        }
        .project-copy ol li {
            padding-left: 2rem;
            counter-increment: impl;
        }
        .project-copy ol li::before {
            content: counter(impl, decimal-leading-zero);
            top: 0.35em;
            width: auto;
            height: auto;
            border-radius: 0;
            background: none;
            font-size: 0.75em;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: #64748b;
        }
        .dark .project-copy ol li::before { color: #94a3b8; }
        .project-copy code {
            padding: 0.12rem 0.32rem;
            border-radius: 0.35rem;
            background: rgba(148, 163, 184, 0.18);
            color: #334155;
            font-size: 0.92em;
        }
        .dark .project-copy code {
            color: #cbd5e1;
            background: rgba(148, 163, 184, 0.16);
        }
        .challenge-row {
            display: grid;
            grid-template-columns: 4.5rem 1fr;
            gap: 0.9rem;
            align-items: start;
        }
        .challenge-row-spaced {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(100, 116, 139, 0.18);
        }
        .challenge-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 1.65rem;
            border-radius: 999px;
            background: rgba(100, 116, 139, 0.14);
            color: #334155;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .dark .challenge-label {
            background: rgba(148, 163, 184, 0.18);
            color: #e2e8f0;
        }
        .challenge-row p {
            margin-top: 0;
            line-height: 1.75;
        }
        @media (max-width: 520px) {
            .challenge-row {
                grid-template-columns: 1fr;
                gap: 0.45rem;
            }
            .challenge-label {
                width: fit-content;
                padding: 0 0.75rem;
            }
        }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0f172a] dark:text-slate-200 min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 glass px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="{{ site.baseurl }}/" class="text-xl md:text-2xl font-extrabold tracking-tighter text-slate-900 dark:text-white">
                yevettee<span class="text-slate-400">.</span>
            </a>

            <div class="flex items-center space-x-4 md:space-x-8">
                <div class="hidden md:flex space-x-8 font-medium">
                    <a href="{{ site.baseurl }}/#about" class="hover:text-slate-500 dark:hover:text-slate-400 transition">About</a>
                    <a href="{{ site.baseurl }}/#stack" class="hover:text-slate-500 dark:hover:text-slate-400 transition">Stack</a>
                    <a href="{{ site.baseurl }}/#projects" class="hover:text-slate-500 dark:hover:text-slate-400 transition">Projects</a>
                    <a href="{{ site.author.resume | relative_url }}" target="_blank" rel="noopener" class="hover:text-slate-500 dark:hover:text-slate-400 transition">Resume</a>
                    <a href="{{ site.baseurl }}/#contact" class="hover:text-slate-500 dark:hover:text-slate-400 transition">Contact</a>
                </div>

                <div class="flex items-center space-x-2 md:space-x-4">
                    <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-yellow-400 hover:ring-2 ring-slate-400 transition-all duration-300">
                        <span id="theme-toggle-dark-icon" class="hidden text-xl">🌙</span>
                        <span id="theme-toggle-light-icon" class="hidden text-xl">☀️</span>
                    </button>

                    <button id="mobile-menu-button" class="md:hidden p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                        <svg id="hamburger-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden flex-col md:hidden mt-4 space-y-4 pb-4 animate__animated animate__fadeIn">
            <a href="{{ site.baseurl }}/#about" class="block px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">About</a>
            <a href="{{ site.baseurl }}/#stack" class="block px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">Stack</a>
            <a href="{{ site.baseurl }}/#projects" class="block px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">Projects</a>
            <a href="{{ site.author.resume | relative_url }}" target="_blank" rel="noopener" class="block px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">Resume</a>
            <a href="{{ site.baseurl }}/#contact" class="block px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">Contact</a>
        </div>
    </nav>

    <main class="flex-grow">
        {{ content }}
    </main>

    <footer class="p-5 text-center text-slate-500 border-t border-slate-200 dark:border-slate-800">
        <p>&copy; 2026 {{ site.author.name }} — {{ site.author.role }} · {{ site.author.location }}</p>
    </footer>

    <script>
        // --- Dark Mode Logic ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateIcons() {
            if (document.documentElement.classList.contains('dark')) {
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            }
        }

        updateIcons();

        themeToggleBtn.addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
            updateIcons();
        });

        // --- Mobile Menu Logic ---
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');

        menuButton.addEventListener('click', () => {
            const isOpen = mobileMenu.classList.toggle('hidden');
            const active = !mobileMenu.classList.contains('hidden');

            // Update Icon (Hamburger to X)
            if (active) {
                hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
            } else {
                hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>`;
            }
        });

        // Close menu on resize to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                mobileMenu.classList.add('hidden');
                hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>`;
            }
        });
    </script>
</body>
</html>
