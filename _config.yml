# uta-folio style skill cards (icon / name / description)
skills_title: "What I Do"
skills:
  - name: "System Integration"
    icon: "🤖"
    description: "팀원들이 개발한 기능을 하나의 로봇 시스템으로 통합합니다. 개별 기능보다 전체 시스템이 안정적으로 동작하는 구조를 만드는 데 집중합니다."
  - name: "Simulation & Validation"
    icon: "🕹️"
    description: "Gazebo와 Isaac Sim에서 먼저 검증한 뒤, 실로봇에서 Bring-up과 테스트를 진행합니다. 시뮬레이션과 실제 환경의 차이에서 생기는 문제를 찾아 해결합니다."
  - name: "Practical Problem Solving"
    icon: "🧭"
    description: "개발 기간과 장비, 구현 난이도를 고려해 실행 가능한 범위를 먼저 정합니다. 복잡한 방법보다 통합과 유지보수가 쉬운 구조를 우선합니다."

tech_stack: [ROS 2, Python, Gazebo, NVIDIA Isaac Sim, Nav2, OpenCV, YOLO, Linux, Git]

projects_title: "Featured Projects"

# ─── Build ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
