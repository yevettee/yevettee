hero:
  tagline: >-
    I integrate perception, navigation, control, and simulation
    into reliable robotic systems.

# uta-folio style skill cards (icon / name / description)
skills_title: "What I Do"
skills_description: "Core areas I work across, from simulation to real robots."
skills:
  - name: "Robot System Integration"
    icon: "🤖"
    description: "ROS 2 interface design, system bring-up, and connecting perception, control, and UI modules into one working robot system."
  - name: "Simulation & Validation"
    icon: "🕹️"
    description: "Gazebo, NVIDIA Isaac Sim, and AirSim — validating robot behavior in simulation before deploying to real hardware."
  - name: "Computer Vision"
    icon: "👁️"
    description: "OpenCV, YOLO, and camera calibration for detection and vision-guided robot tasks."

tech_stack: [ROS 2, Python, C++, Gazebo, NVIDIA Isaac Sim, Nav2, OpenCV, YOLO, Linux, Git]

projects_title: "Featured Projects"
projects_description: "Robot systems I built and integrated, in teams and solo."

# ─── Build ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
